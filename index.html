<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratik Gawande Photography | Cinematic Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-zinc-100 font-sans antialiased overflow-x-hidden">

    <!-- Ultra-Clean Transparent Navbar -->
    <nav class="absolute w-full top-0 z-50 pt-8 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 sm:px-10">
            <div class="flex items-center justify-between h-20">
                
                <!-- THE FIX: Original Logo WITH its misty background, framed like a premium badge -->
                <div class="flex-shrink-0">
                    <a href="index.html" class="block rounded-lg overflow-hidden border border-white/20 shadow-[0_0_20px_rgba(0,0,0,0.6)] group">
                        <img src="./logo.jpg" alt="PGP Logo" class="h-16 w-auto object-cover opacity-95 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">
                    </a>
                </div>

                <!-- Links -->
                <div class="hidden md:block">
                    <div class="ml-10 flex items-center space-x-12 text-[11px] font-semibold uppercase tracking-[0.25em]">
                        <a href="index.html" class="text-white border-b border-white pb-1">Home</a>
                        <a href="portfolio.html" class="text-zinc-400 hover:text-white transition duration-300">Portfolio</a>
                        <a href="services.html" class="text-zinc-400 hover:text-white transition duration-300">Services</a>
                        <a href="about.html" class="text-zinc-400 hover:text-white transition duration-300">About</a>
                        <a href="inquiry.html" class="text-white hover:text-zinc-300 transition duration-300 relative group">
                            Get Quote
                            <span class="absolute -bottom-1 left-0 w-0 h-[1px] bg-white transition-all duration-300 group-hover:w-full"></span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Editorial Hero Section -->
    <div class="relative h-screen w-full flex items-center justify-center bg-black">
        
        <div class="absolute inset-0 w-full h-full bg-cover bg-center opacity-60 scale-105 animate-[pulse_20s_ease-in-out_infinite]" 
             style="background-image: url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80');">
        </div>
        
        <!-- Darkened gradient for flawless text readability -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/40 to-black/90"></div>
        
        <!-- Text Content -->
        <div class="relative z-10 text-center px-4 max-w-4xl flex flex-col items-center mt-10">
            
            <span class="uppercase tracking-[0.3em] text-[10px] text-zinc-300 mb-8 font-medium border border-zinc-500/50 px-4 py-1 rounded-full backdrop-blur-sm">Amravati & Beyond</span>
            
            <h1 class="font-serif text-5xl md:text-7xl lg:text-8xl text-white mb-6 leading-tight drop-shadow-lg">
                <span class="italic font-light text-zinc-200">Cinematic</span> Stories,<br>
                <span class="font-semibold tracking-tight">Timeless Memories.</span>
            </h1>
            
            <!-- Increased contrast with font-medium and drop-shadow-lg -->
            <p class="text-sm md:text-base text-zinc-200 mb-12 max-w-xl mx-auto font-medium leading-relaxed drop-shadow-lg">
                We craft unposed, breathtaking visuals for your biggest moments. Experience storytelling that feels as natural as the moment it happened.
            </p>
            
            <!-- Softened, rounded glass button -->
            <a href="inquiry.html" class="group relative inline-flex items-center justify-center px-8 py-4 text-xs font-semibold uppercase tracking-[0.2em] text-white border border-white/20 rounded-full backdrop-blur-md hover:bg-white hover:text-black transition-all duration-500 overflow-hidden shadow-[0_0_40px_rgba(255,255,255,0.1)]">
                <span class="relative z-10 flex items-center gap-3">
                    Check Availability
                    <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </span>
            </a>
        </div>

        <!-- Scroll Indicator -->
        <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2 flex flex-col items-center animate-bounce">
            <span class="text-[9px] uppercase tracking-[0.3em] text-zinc-400 mb-2">Scroll</span>
            <div class="w-[1px] h-10 bg-zinc-600"></div>
        </div>
    </div>

</body>
</html>
