<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | Pratik Gawande Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] } } } }
    </script>
</head>
<body class="bg-black text-zinc-100 font-sans antialiased overflow-x-hidden">

    <nav class="w-full top-0 z-50 pt-4 pb-4 bg-black border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 sm:px-10">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0">
                    <a href="index.html" class="block rounded overflow-hidden border border-white/20 shadow-[0_0_15px_rgba(0,0,0,0.8)] group">
                        <img src="./logo.jpg" alt="PGP Logo" class="h-12 w-auto object-cover opacity-95 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">
                    </a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-center space-x-10 text-[11px] font-semibold uppercase tracking-[0.25em]">
                        <a href="index.html" class="text-zinc-400 hover:text-white transition duration-300">Home</a>
                        <a href="portfolio.html" class="text-zinc-400 hover:text-white transition duration-300">Portfolio</a>
                        <a href="services.html" class="text-zinc-400 hover:text-white transition duration-300">Services</a>
                        <a href="about.html" class="text-zinc-400 hover:text-white transition duration-300">About</a>
                        <a href="inquiry.html" class="text-white border-b border-white pb-1">Get Quote</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-24 bg-black min-h-screen">
        <div class="max-w-3xl mx-auto px-4">
            <div class="text-center mb-12">
                <h2 class="font-serif text-4xl font-bold text-white">Let's Create Together</h2>
                <p class="text-zinc-400 mt-4 font-light">Fill out the details below to receive a custom quote on WhatsApp.</p>
            </div>

            <form id="inquiryForm" class="bg-zinc-900 p-8 rounded-xl border border-zinc-800 shadow-2xl space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">Full Name</label>
                        <input type="text" id="name" required class="w-full bg-black border border-zinc-700 rounded px-4 py-3 text-white focus:outline-none focus:border-zinc-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">WhatsApp Number</label>
                        <input type="tel" id="phone" required class="w-full bg-black border border-zinc-700 rounded px-4 py-3 text-white focus:outline-none focus:border-zinc-400">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">Event Date</label>
                        <input type="date" id="date" required class="w-full bg-black border border-zinc-700 rounded px-4 py-3 text-white focus:outline-none focus:border-zinc-400" style="color-scheme: dark;">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">Event Location / Venue</label>
                        <input type="text" id="location" required class="w-full bg-black border border-zinc-700 rounded px-4 py-3 text-white focus:outline-none focus:border-zinc-400" placeholder="e.g. Amravati">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Event Type</label>
                    <select id="type" class="w-full bg-black border border-zinc-700 rounded px-4 py-3 text-white focus:outline-none focus:border-zinc-400">
                        <option value="Wedding">Wedding</option>
                        <option value="Pre-Wedding">Pre-Wedding</option>
                        <option value="Ring Ceremony">Ring Ceremony</option>
                        <option value="Other">Other Event</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-white text-black font-semibold text-lg py-4 rounded hover:bg-zinc-200 transition duration-300 mt-4">
                    Get My Custom Quote
                </button>
            </form>
        </div>
    </section>

    <footer class="bg-black py-10 text-center border-t border-zinc-900">
        <p class="text-zinc-500 text-sm">Shegaon naka, Ashiyad chowk near Bagde Niwas, Amravati</p>
        <p class="text-zinc-500 text-sm mt-2">&copy; 2026 Pratik Gawande Photography. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('inquiryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const date = document.getElementById('date').value;
            const location = document.getElementById('location').value;
            const type = document.getElementById('type').value;
            const text = `Hi Pratik! I'd like a custom photography quote.%0A%0A*Name:* ${name}%0A*Contact:* ${phone}%0A*Event Date:* ${date}%0A*Location:* ${location}%0A*Event Type:* ${type}`;
            window.open(`https://wa.me/919021841052?text=${text}`, '_blank');
        });
    </script>
